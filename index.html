<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>⚡ X Account Checker By.Otoy</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#070a11;
  --text:#f5f7fb;
  --muted:#8994a6;

  --blue:#2997ff;
  --cyan:#22d3ee;
  --green:#22c55e;
  --yellow:#facc15;
  --red:#ef4444;
  --purple:#a855f7;
  --pink:#ec4899;

  --border:#30394a;
}

html{
  min-height:100%;
}

body{
  min-height:100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color:var(--text);

  background:
    radial-gradient(
      circle at 5% 5%,
      rgba(37,99,235,.28),
      transparent 25%
    ),
    radial-gradient(
      circle at 95% 10%,
      rgba(168,85,247,.20),
      transparent 25%
    ),
    radial-gradient(
      circle at 0% 65%,
      rgba(34,211,238,.13),
      transparent 25%
    ),
    radial-gradient(
      circle at 100% 75%,
      rgba(236,72,153,.12),
      transparent 25%
    ),
    radial-gradient(
      circle at 50% 100%,
      rgba(34,197,94,.12),
      transparent 32%
    ),
    #070a11;

  background-attachment:fixed;
}

.container{
  width:100%;
  max-width:920px;
  margin:auto;
  padding:14px;
}


/* =====================================================
   HEADER
   ===================================================== */

.header{
  position:relative;
  overflow:hidden;

  padding:20px 18px;

  margin-bottom:14px;

  border-radius:18px;

  border:1px solid
    rgba(77,163,255,.35);

  background:
    linear-gradient(
      135deg,
      rgba(20,44,82,.96),
      rgba(14,22,39,.96) 45%,
      rgba(35,19,61,.92)
    );

  box-shadow:
    0 0 25px
      rgba(37,99,235,.15),
    inset 0 0 30px
      rgba(77,163,255,.04);
}

.header:before{
  content:"";

  position:absolute;

  width:230px;
  height:230px;

  right:-100px;
  top:-120px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(77,163,255,.35),
      transparent 65%
    );

  filter:blur(5px);
}

.header:after{
  content:"";

  position:absolute;

  width:170px;
  height:170px;

  left:-100px;
  bottom:-120px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(168,85,247,.25),
      transparent 65%
    );
}

.header h1{
  position:relative;
  z-index:2;

  font-size:22px;
  font-weight:900;

  color:#4da3ff;

  text-shadow:
    0 0 12px
      rgba(77,163,255,.35);
}

.header p{
  position:relative;
  z-index:2;

  margin-top:6px;

  font-size:12px;

  color:#9ba8bb;
}


/* =====================================================
   GENERAL CARD
   ===================================================== */

.card{
  position:relative;
  overflow:hidden;

  margin-bottom:14px;

  padding:16px;

  border-radius:17px;

  border:1px solid
    rgba(91,105,128,.38);

  background:
    linear-gradient(
      145deg,
      rgba(20,25,35,.96),
      rgba(10,15,23,.97)
    );

  box-shadow:
    0 8px 30px
      rgba(0,0,0,.22);
}

.card:before{
  content:"";

  position:absolute;

  width:180px;
  height:180px;

  right:-100px;
  top:-100px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(77,163,255,.08),
      transparent 70%
    );

  pointer-events:none;
}

.card-title,
.section-title{
  position:relative;
  z-index:1;

  font-size:15px;
  font-weight:900;

  margin-bottom:11px;
}


/* =====================================================
   USERNAME INPUT
   ===================================================== */

textarea{
  width:100%;
  height:155px;

  resize:vertical;

  padding:14px;

  color:#f5f7fb;

  font-size:13px;
  line-height:1.55;

  outline:none;

  border-radius:13px;

  border:1px solid
    rgba(77,163,255,.35);

  background:
    linear-gradient(
      145deg,
      #070b12,
      #0b111a
    );

  box-shadow:
    inset 0 0 25px
      rgba(37,99,235,.05),
    0 0 15px
      rgba(37,99,235,.04);
}

textarea:focus{
  border-color:#2997ff;

  box-shadow:
    0 0 18px
      rgba(41,151,255,.18),
    inset 0 0 25px
      rgba(37,99,235,.06);
}

textarea::placeholder{
  color:#6d7888;
}


/* =====================================================
   FILE INPUT
   ===================================================== */

.file-row{
  margin-top:10px;
}

input[type="file"]{
  width:100%;

  padding:9px;

  color:#8d99aa;

  font-size:12px;

  border-radius:11px;

  border:1px solid
    rgba(77,163,255,.25);

  background:
    linear-gradient(
      90deg,
      rgba(14,22,34,.95),
      rgba(11,16,25,.95)
    );
}


/* =====================================================
   BUTTONS
   ===================================================== */

.button-row{
  display:flex;
  gap:9px;

  margin-top:10px;
}

button{
  border:0;

  border-radius:11px;

  padding:12px 15px;

  font-size:13px;
  font-weight:900;

  cursor:pointer;

  transition:
    .2s ease;
}

button:active{
  transform:scale(.98);
}

button:disabled{
  opacity:.42;
  cursor:not-allowed;
}


/* BLUE START */

.btn-start{
  flex:1;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      #1687ff,
      #2864ff,
      #5546e8
    );

  box-shadow:
    0 0 18px
      rgba(37,124,255,.28);
}

.btn-start:hover{
  filter:brightness(1.12);

  box-shadow:
    0 0 25px
      rgba(37,124,255,.38);
}


/* CSV */

.btn-export{
  color:#fff;

  background:
    linear-gradient(
      135deg,
      #464a55,
      #303642
    );

  border:1px solid
    rgba(250,204,21,.20);

  box-shadow:
    0 0 10px
      rgba(250,204,21,.04);
}

.btn-export:hover{
  border-color:
    rgba(250,204,21,.45);

  box-shadow:
    0 0 15px
      rgba(250,204,21,.10);
}


/* =====================================================
   PROGRESS
   ===================================================== */

.progress-box{
  margin-top:14px;
}

.progress-info{
  display:flex;
  justify-content:space-between;

  margin-bottom:7px;

  font-size:11px;

  color:#8d99a9;
}

.progress{
  width:100%;
  height:9px;

  overflow:hidden;

  border-radius:20px;

  background:
    linear-gradient(
      90deg,
      #1b2532,
      #202a39
    );

  border:1px solid
    rgba(77,163,255,.10);
}

.progress-bar{
  width:0%;
  height:100%;

  border-radius:20px;

  background:
    linear-gradient(
      90deg,
      #1687ff,
      #22d3ee,
      #4da3ff
    );

  box-shadow:
    0 0 15px
      rgba(34,211,238,.55);

  transition:.25s;
}


/* =====================================================
   DASHBOARD
   ===================================================== */

.dashboard{
  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:8px;

  margin-bottom:14px;
}

.stat{
  position:relative;

  overflow:hidden;

  min-height:72px;

  display:flex;
  flex-direction:column;
  justify-content:center;

  border-radius:14px;

  padding:10px 4px;

  text-align:center;

  background:
    linear-gradient(
      145deg,
      rgba(19,26,38,.98),
      rgba(9,14,21,.98)
    );

  border:1px solid
    rgba(75,87,108,.38);

  box-shadow:
    inset 0 0 20px
      rgba(255,255,255,.01);
}

.stat:before{
  content:"";

  position:absolute;

  width:85px;
  height:85px;

  right:-45px;
  top:-45px;

  border-radius:50%;

  filter:blur(3px);

  opacity:.35;
}

.stat-number{
  position:relative;
  z-index:2;

  font-size:21px;
  font-weight:900;
}

.stat-label{
  position:relative;
  z-index:2;

  margin-top:4px;

  font-size:8px;

  letter-spacing:.4px;

  color:#7f8b9d;
}


/* TOTAL */

.stat:first-child{
  border-color:
    rgba(77,163,255,.28);
}

.stat:first-child
.stat-number{
  color:#60a5fa;
}

.stat:first-child:before{
  background:#2997ff;
}


/* ACTIVE */

.stat.active{
  border-color:
    rgba(34,197,94,.35);

  background:
    linear-gradient(
      145deg,
      rgba(20,53,40,.55),
      rgba(9,18,18,.98)
    );

  box-shadow:
    0 0 15px
      rgba(34,197,94,.07);
}

.stat.active
.stat-number{
  color:#22c55e;

  text-shadow:
    0 0 10px
      rgba(34,197,94,.30);
}

.stat.active:before{
  background:#22c55e;
}


/* SUSPENDED */

.stat.suspended{
  border-color:
    rgba(239,68,68,.35);

  background:
    linear-gradient(
      145deg,
      rgba(65,25,31,.58),
      rgba(18,10,14,.98)
    );

  box-shadow:
    0 0 15px
      rgba(239,68,68,.07);
}

.stat.suspended
.stat-number{
  color:#ef4444;

  text-shadow:
    0 0 10px
      rgba(239,68,68,.30);
}

.stat.suspended:before{
  background:#ef4444;
}


/* NOT FOUND */

.stat.notfound{
  border-color:
    rgba(250,204,21,.35);

  background:
    linear-gradient(
      145deg,
      rgba(65,54,20,.58),
      rgba(19,16,9,.98)
    );

  box-shadow:
    0 0 15px
      rgba(250,204,21,.06);
}

.stat.notfound
.stat-number{
  color:#facc15;

  text-shadow:
    0 0 10px
      rgba(250,204,21,.25);
}

.stat.notfound:before{
  background:#facc15;
}


/* ERROR */

.stat.error{
  border-color:
    rgba(168,85,247,.35);

  background:
    linear-gradient(
      145deg,
      rgba(48,25,70,.55),
      rgba(15,10,24,.98)
    );

  box-shadow:
    0 0 15px
      rgba(168,85,247,.07);
}

.stat.error
.stat-number{
  color:#a855f7;

  text-shadow:
    0 0 10px
      rgba(168,85,247,.30);
}

.stat.error:before{
  background:#a855f7;
}


/* =====================================================
   SUSPENDED ACCOUNTS
   ===================================================== */

.suspended-list{
  display:flex;
  flex-direction:column;

  gap:8px;
}

.suspended-item{
  padding:11px;

  border-radius:11px;

  color:#f87171;

  font-size:12px;
  font-weight:700;

  border:1px solid
    rgba(239,68,68,.28);

  background:
    linear-gradient(
      90deg,
      rgba(82,25,32,.45),
      rgba(35,14,20,.65),
      rgba(15,17,23,.75)
    );

  box-shadow:
    0 0 18px
      rgba(239,68,68,.08),
    inset 0 0 15px

}


/* =====================================================

.table-wrapper{
  width:100%;

  overflow-x:auto;

  border-radius:12px;

}

table{
  width:100%;

  min-width:700px;

  border-collapse:collapse;
}

thead{
  background:
    linear-gradient(
      90deg,
      #0a121e,
      #0d111b,
      #120e1c
    );
}

th{
  padding:11px 8px;

  color:#8491a4;

  font-size:10px;

  text-align:left;

  border-bottom:1px solid
    rgba(77,163,255,.20);
}

td{
  padding:10px 8px;

  font-size:11px;

  vertical-align:top;

  border-bottom:1px solid
    rgba(61,73,91,.45);
}

tbody tr{
  background:
    linear-gradient(
      90deg,
      rgba(16,23,33,.85),
      rgba(13,18,27,.90)
    );
}

tbody tr:nth-child(even){
  background:

      90deg,
      rgba(19,27,39,.82),
      rgba(13,18,27,.90)

}

tbody tr:hover{
  background:
    linear-gradient(
      90deg,
      rgba(30,54,82,.55),
      rgba(37,25,57,.45)
    );
}

.username{
  color:#e8eef7;

  font-weight:800;
}

.detail{
  color:#7f8b9c;

  max-width:280px;

  word-break:break-word;
}


/* =====================================================
   BADGES
   ===================================================== */

.badge{
  display:inline-block;

  padding:5px 9px;

  border-radius:7px;

  font-size:9px;
  font-weight:900;

  white-space:nowrap;
}


/* ACTIVE */

.badge-active{
  color:#4ade80;

  background:
    linear-gradient(
      135deg,
      rgba(34,197,94,.24),
      rgba(22,101,52,.18)
    );

  border:1px solid

}


/* SUSPENDED */

.badge-suspended{

  background:

  border:1px solid

}


/* NOT FOUND */

.badge-notfound{
  color:#fde047;

  border:1px solid

/* ERROR */

.badge-error{
  color:#d8b4fe;

/* =====================================================

/* =====================================================
   MOBILE
   ===================================================== */

@media(max-width:600px){

  .container{

  }

  }

</style>
</head>


<body>

<div class="container">


<!-- =====================================================
     HEADER
     ===================================================== -->

<div class="header">

  <h1>
    ⚡ X Account Checker By.Otoy
  </h1>

  <p>
    Check public X usernames using FxTwitter API
  </p>

</div>


<!-- =====================================================
     INPUT
     ===================================================== -->

<div class="card">

  <div class="card-title">
    Username Input
  </div>


  <textarea
    id="usernameInput"
    placeholder="Contoh:
1. @username1
2. @username2
3. @username3
4. @username4"
  ></textarea>


  <div class="file-row">

    <input
      type="file"
      id="fileInput"
      accept=".txt"
    >

  </div>


  <div class="button-row">

    <button
      class="btn-start"
      id="startBtn"
      onclick="startChecking()"
    >
      ▶ Start Checking
    </button>


    <button
      class="btn-export"
      id="exportBtn"
      onclick="exportCSV()"
      disabled
    >
      ↓ CSV
    </button>

  </div>


  <!-- PROGRESS -->

  <div class="progress-box">

    <div class="progress-info">

      <span id="progressText">
        Ready
      </span>

      <span id="progressPercent">
        0%
      </span>

    </div>


    <div class="progress">

      <div
        class="progress-bar"
        id="progressBar"
      ></div>

    </div>

  </div>

</div>


<!-- =====================================================
     DASHBOARD
     ===================================================== -->

<div class="dashboard">


  <div class="stat">

    <div
      class="stat-number"
      id="totalCount"
    >
      0
    </div>

    <div class="stat-label">
      TOTAL
    </div>

  </div>


  <div class="stat active">

    <div
      class="stat-number"
      id="activeCount"
    >
      0
    </div>

    <div class="stat-label">
      ACTIVE
    </div>

  </div>


  <div class="stat suspended">

    <div
      class="stat-number"
      id="suspendedCount"
    >
      0
    </div>

    <div class="stat-label">
      SUSPENDED
    </div>

  </div>


  <div class="stat notfound">

    <div
      class="stat-number"
      id="notFoundCount"
    >
      0
    </div>

    <div class="stat-label">
      NOT FOUND
    </div>

  </div>


  <div class="stat error">

    <div
      class="stat-number"
      id="errorCount"
    >
      0
    </div>

    <div class="stat-label">
      ERROR
    </div>

  </div>

</div>


<!-- =====================================================
     SUSPENDED ACCOUNTS
     ===================================================== -->

<div class="card">

  <div class="section-title">
    Suspended Accounts
  </div>


  <div
    class="suspended-list"
    id="suspendedList"
  >

    <div class="empty">
      Belum ada akun suspended
    </div>

  </div>

</div>


<!-- =====================================================
     RESULTS
     ===================================================== -->

<div class="card">

  <div class="section-title">
    Results
  </div>


  <div class="table-wrapper">

    <table>

      <thead>

        <tr>

          <th>#</th>

          <th>Username</th>

          <th>Status</th>

          <th>Name</th>

          <th>ID</th>

          <th>Detail</th>

        </tr>

      </thead>


      <tbody id="resultsBody">

        <tr>

          <td colspan="6">

            <div class="empty">
              Belum ada hasil pemeriksaan
            </div>

          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>


</div>


<script>

/* =========================================================
   FXTWITTER API
   ========================================================= */

const API_BASE =
  "https://api.fxtwitter.com/2/profile/";


/* =========================================================
   DATA
   ========================================================= */

let results = [];

let isChecking = false;


/* =========================================================
   FILE INPUT
   ========================================================= */

document
  .getElementById("fileInput")
  .addEventListener(
    "change",
    function(){

      const file =
        this.files[0];

      if(!file){
        return;
      }

      const reader =
        new FileReader();

      reader.onload =
        function(e){

          document
            .getElementById(
              "usernameInput"
            )
            .value =
              e.target.result;

        };

      reader.readAsText(file);

    }
  );


/* =========================================================
   PARSE USERNAME
   ========================================================= */

function parseUsernames(){

  const input =
    document
      .getElementById(
        "usernameInput"
      )
      .value;

  const lines =
    input
      .split(/\r?\n/)
      .map(
        line =>
          line.trim()
      )
      .filter(
        line =>
          line.length > 0
      );

  const accounts = [];


  lines.forEach(
    (line,index)=>{

      let number =
        index + 1;


      const numbered =
        line.match(
          /^\s*(\d+)\s*[\.\)]\s*(.*)$/
        );


      let username =
        line;


      if(numbered){

        number =
          parseInt(
            numbered[1],
            10
          );

        username =
          numbered[2].trim();

      }


      username =
        username
          .replace(
            /^@+/,
            ""
          )
          .trim();


      if(username){

        accounts.push({

          number:number,

          username:username

        });

      }

    }
  );


  return accounts;

}


/* =========================================================
   CHECK USERNAME
   ========================================================= */

async function checkUsername(username){

  const clean =
    username
      .trim()
      .replace(
        /^@+/,
        ""
      );


  if(
    !/^[A-Za-z0-9_]{1,15}$/
      .test(clean)
  ){

    return {

      status:"ERROR",

      name:"-",

      id:"-",

      detail:
        "Invalid username"

    };

  }


  const url =
    API_BASE +
    encodeURIComponent(clean);


  try{

    const response =
      await fetch(
        url,
        {
          method:"GET",

          headers:{
            "Accept":
              "application/json"
          },

          cache:"no-store"
        }
      );


    let data = {};


    try{

      data =
        await response.json();

    }catch(e){

      data = {};

    }


    const apiCode =
      Number(
        data.code || 0
      );


    const responseStatus =
      Number(
        response.status || 0
      );


    const responseText =
      JSON.stringify(data)
        .toLowerCase();


    /* =====================================================
       SUSPENDED
       ===================================================== */

    if(
      responseText.includes(
        "suspend"
      ) ||
      responseText.includes(
        "suspended"
      )
    ){

      const user =
        data.user || {};


      return {

        status:"SUSPENDED",

        name:
          user.name ||
          user.display_name ||
          "-",

        id:
          user.id ||
          "-",

        detail:
          data.message ||
          data.reason ||
          "Account suspended"

      };

    }


    /* =====================================================
       ACTIVE
       ===================================================== */

    if(
      data.user &&
      typeof data.user ===
        "object"
    ){

      const user =
        data.user;


      return {

        status:"ACTIVE",

        name:
          user.name ||
          user.display_name ||
          "-",

        id:
          user.id ||
          "-",

        detail:
          "Account active"

      };

    }


    /* =====================================================
       NOT FOUND
       ===================================================== */

    if(
      responseStatus === 404 ||
      apiCode === 404
    ){

      return {

        status:"NOT FOUND",

        name:"-",

        id:"-",

        detail:
          data.message ||
          data.reason ||
          "User not found"

      };

    }


    const notFoundWords = [

      "not found",

      "user not found",

      "user does not exist",

      "does not exist",

      "no user",

      "unknown user",

      "could not find",

      "cannot find",

      "can't find",

      "account not found",

      "profile not found",

      "username not found"

    ];


    const isNotFound =
      notFoundWords.some(
        word =>
          responseText
            .includes(word)
      );


    if(isNotFound){

      return {

        status:"NOT FOUND",

        name:"-",

        id:"-",

        detail:
          data.message ||
          data.reason ||
          "User not found"

      };

    }


    /* =====================================================
       ERROR
       ===================================================== */

    let detail = "";


    if(data.message){

      detail =
        data.message;

    }else if(data.reason){

      detail =
        data.reason;

    }else if(apiCode){

      detail =
        "API code " +
        apiCode;

    }else{

      detail =
        "HTTP " +
        responseStatus;

    }


    return {

      status:"ERROR",

      name:"-",

      id:"-",

      detail:detail

    };


  }catch(error){

    return {

      status:"ERROR",

      name:"-",

      id:"-",

      detail:
        "Network/API error"

    };

  }

}


/* =========================================================
   DELAY
   ========================================================= */

function delay(ms){

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


/* =========================================================
   START CHECKING
   ========================================================= */

async function startChecking(){

  if(isChecking){
    return;
  }


  const accounts =
    parseUsernames();


  if(accounts.length === 0){

    alert(
      "Masukkan username terlebih dahulu."
    );

    return;

  }


  isChecking = true;

  results = [];


  const startBtn =
    document.getElementById(
      "startBtn"
    );


  const exportBtn =
    document.getElementById(
      "exportBtn"
    );


  startBtn.disabled = true;

  exportBtn.disabled = true;


  document
    .getElementById(
      "resultsBody"
    )
    .innerHTML = "";


  document
    .getElementById(
      "suspendedList"
    )
    .innerHTML = "";


  document
    .getElementById(
      "progressBar"
    )
    .style.width = "0%";


  document
    .getElementById(
      "progressPercent"
    )
    .textContent = "0%";


  document
    .getElementById(
      "progressText"
    )
    .textContent =
      "0/" +
      accounts.length;


  updateDashboard();


  const total =
    accounts.length;


  for(
    let i = 0;
    i < total;
    i++
  ){

    const account =
      accounts[i];


    if(i > 0){

      await delay(250);

    }


    const result =
      await checkUsername(
        account.username
      );


    results.push({

      number:
        account.number,

      username:
        account.username,

      status:
        result.status,

      name:
        result.name,

      id:
        result.id,

      detail:
        result.detail

    });


    renderResults();

    updateDashboard();


    const progress =
      Math.round(
        ((i + 1) / total) *
        100
      );


    document
      .getElementById(
        "progressBar"
      )
      .style.width =
        progress + "%";


    document
      .getElementById(
        "progressPercent"
      )
      .textContent =
        progress + "%";


    document
      .getElementById(
        "progressText"
      )
      .textContent =
        (i + 1) +
        "/" +
        total;

  }


  isChecking = false;

  startBtn.disabled = false;

  exportBtn.disabled =
    results.length === 0;


  document
    .getElementById(
      "progressText"
    )
    .textContent =
      total +
      "/" +
      total;


  document
    .getElementById(
      "progressPercent"
    )
    .textContent =
      "100%";

}


/* =========================================================
   DASHBOARD
   ========================================================= */

function updateDashboard(){

  let active = 0;

  let suspended = 0;

  let notFound = 0;

  let error = 0;


  results.forEach(
    item=>{

      if(
        item.status ===
        "ACTIVE"
      ){

        active++;

      }else if(
        item.status ===
        "SUSPENDED"
      ){

        suspended++;

      }else if(
        item.status ===
        "NOT FOUND"
      ){

        notFound++;

      }else if(
        item.status ===
        "ERROR"
      ){

        error++;

      }

    }
  );


  document
    .getElementById(
      "totalCount"
    )
    .textContent =
      results.length;


  document
    .getElementById(
      "activeCount"
    )
    .textContent =
      active;


  document
    .getElementById(
      "suspendedCount"
    )
    .textContent =
      suspended;


  document
    .getElementById(
      "notFoundCount"
    )
    .textContent =
      notFound;


  document
    .getElementById(
      "errorCount"
    )
    .textContent =
      error;


  renderSuspended();

}


/* =========================================================
   SUSPENDED LIST
   ========================================================= */

function renderSuspended(){

  const box =
    document.getElementById(
      "suspendedList"
    );


  const suspended =
    results.filter(
      item =>
        item.status ===
        "SUSPENDED"
    );


  if(
    suspended.length === 0
  ){

    box.innerHTML = `

      <div class="empty">
        Belum ada akun suspended
      </div>

    `;

    return;

  }


  box.innerHTML =
    suspended
      .map(
        item => `

          <div class="suspended-item">

            ${escapeHTML(
              String(
                item.number
              )
            )}.

            @${escapeHTML(
              item.username
            )}

          </div>

        `
      )
      .join("");

}


/* =========================================================
   RESULTS
   ========================================================= */

function renderResults(){

  const tbody =
    document.getElementById(
      "resultsBody"
    );


  if(results.length === 0){

    tbody.innerHTML = `

      <tr>

        <td colspan="6">

          <div class="empty">
            Belum ada hasil pemeriksaan
          </div>

        </td>

      </tr>

    `;

    return;

  }


  tbody.innerHTML =
    results
      .map(
        item => {

          let badgeClass =
            "badge-error";


          if(
            item.status ===
            "ACTIVE"
          ){

            badgeClass =
              "badge-active";

          }else if(
            item.status ===
            "SUSPENDED"
          ){

            badgeClass =
              "badge-suspended";

          }else if(
            item.status ===
            "NOT FOUND"
          ){

            badgeClass =
              "badge-notfound";

          }


          return `

            <tr>

              <td>
                ${escapeHTML(
                  String(
                    item.number
                  )
                )}
              </td>


              <td>

                <div class="username">

                  @${escapeHTML(
                    item.username
                  )}

                </div>

              </td>


              <td>

                <span
                  class="badge ${badgeClass}"
                >

                  ${escapeHTML(
                    item.status
                  )}

                </span>

              </td>


              <td>

                ${escapeHTML(
                  item.name || "-"
                )}

              </td>


              <td>

                ${escapeHTML(
                  item.id || "-"
                )}

              </td>


              <td>

                <div class="detail">

                  ${escapeHTML(
                    item.detail || "-"
                  )}

                </div>

              </td>

            </tr>

          `;

        }
      )
      .join("");

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value){

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   EXPORT CSV
   ========================================================= */

function exportCSV(){

  if(results.length === 0){

    alert(
      "Belum ada hasil untuk diekspor."
    );

    return;

  }


  const header = [

    "#",

    "Username",

    "Status",

    "Name",

    "ID",

    "Detail"

  ];


  const rows = [

    header,

    ...results.map(
      item => [

        item.number,

        "@" +
          item.username,

        item.status,

        item.name,

        item.id,

        item.detail

      ]
    )

  ];


  const csv =
    rows
      .map(
        row =>
          row
            .map(
              value =>
                csvEscape(value)
            )
            .join(",")
      )
      .join("\n");


  const blob =
    new Blob(
      [csv],
      {
        type:
          "text/csv;charset=utf-8;"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement(
      "a"
    );


  const now =
    new Date();


  const date =
    now
      .toISOString()
      .slice(0,10);


  a.href = url;


  a.download =
    "x_account_checker_" +
    date +
    ".csv";


  document
    .body
    .appendChild(a);


  a.click();


  a.remove();


  URL.revokeObjectURL(url);

}


/* =========================================================
   CSV ESCAPE
   ========================================================= */

function csvEscape(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  const text =
    String(value);


  if(
    text.includes(",") ||
    text.includes('"') ||
    text.includes("\n")
  ){

    return '"' +
      text.replace(
        /"/g,
        '""'
      ) +
      '"';

  }


  return text;

}
